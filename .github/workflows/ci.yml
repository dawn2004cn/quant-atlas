name: CI

on:
  push:
    branches: [ main, architecture/phase-e-v1 ]
  pull_request:
    branches: [ main, architecture/phase-e-v1 ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  compile:
    name: PyCompile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pytest for architecture gate
        run: pip install pytest
      - name: Compile application and test Python files
        run: python -m compileall -q app/ tests/
      - name: Compile CI gate scripts
        run: |
          python -m compileall -q \
            scripts/boot_gate.py \
            scripts/check_module_cross_imports.py \
            scripts/check_template_inline_styles.py \
            scripts/audit_api_routes.py \
            scripts/audit_frontend_api_paths.py \
            scripts/generate_openapi.py
      - name: Module cross-import gate
        run: python scripts/check_module_cross_imports.py
      - name: Template inline style gate
        run: python scripts/check_template_inline_styles.py
      - name: Architecture layer dependency gate
        run: python -m pytest tests/architecture/test_layer_dependency_gate.py -v --no-header

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Check lint rules (CI gate scripts)
        run: |
          ruff check \
            scripts/boot_gate.py \
            app/core/security_sanity.py \
            app/presentation/api/route_contract.py

  integration:
    name: Integration (boot + smoke + compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -e ".[test]" 2>/dev/null || pip install pytest flask
      - name: Compile-check application and test Python files
        run: python -m compileall -q app/ tests/
      - name: Boot test (no external services)
        run: python scripts/boot_gate.py
        env:
          FLASK_ENV: development
          FLASK_SECRET_KEY: ci-boot-gate-secret
          ENABLE_CELERY: "0"
          ENABLE_QLIB: "0"
          ENABLE_RD_AGENT: "0"
          MESH_ENABLED: "0"
          PERCEPTION_ENABLED: "0"
          ENABLE_SOCKETIO: "0"
          TUSHARE_TOKEN: ""
          TASK_MESSAGE_REDIS_URL: "memory://"
      - name: API route contract tests
        run: pytest tests/api/test_template_fetch_contract.py tests/api/test_phase_a_route_contract.py tests/api/test_public_api_contract.py tests/api/test_api_contract.py -q --tb=short
        env:
          FLASK_ENV: development
          FLASK_SECRET_KEY: ci-boot-gate-secret
          ENABLE_CELERY: "0"
          ENABLE_QLIB: "0"
          ENABLE_RD_AGENT: "0"
          MESH_ENABLED: "0"
          PERCEPTION_ENABLED: "0"
          ENABLE_SOCKETIO: "0"
          TUSHARE_TOKEN: ""
          TASK_MESSAGE_REDIS_URL: "memory://"
      - name: Frontend SPA API path audit
        run: python scripts/audit_frontend_api_paths.py
        env:
          FLASK_ENV: development
          FLASK_SECRET_KEY: ci-boot-gate-secret
          ENABLE_CELERY: "0"
          ENABLE_QLIB: "0"
          ENABLE_RD_AGENT: "0"
          MESH_ENABLED: "0"
          PERCEPTION_ENABLED: "0"
          ENABLE_SOCKETIO: "0"
          TUSHARE_TOKEN: ""
          TASK_MESSAGE_REDIS_URL: "memory://"

  smoke:
    name: Smoke tests (no external services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install core deps only
        run: |
          pip install --upgrade pip
          pip install -e ".[test]" 2>/dev/null || pip install pytest
      - name: Run smoke tests
        env:
          FLASK_ENV: development
          FLASK_SECRET_KEY: ci-boot-gate-secret
          ENABLE_CELERY: "0"
          ENABLE_QLIB: "0"
          ENABLE_RD_AGENT: "0"
          MESH_ENABLED: "0"
          PERCEPTION_ENABLED: "0"
          TASK_MESSAGE_REDIS_URL: "memory://"
        run: pytest tests/smoke/test_critical_api_endpoints.py tests/smoke/test_app_boot.py tests/smoke/test_phase69_route_boot.py tests/smoke/test_custom_trading_workflow_compile.py -q --tb=short --no-header

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run unit tests
        env:
          FLASK_ENV: development
          FLASK_SECRET_KEY: ci-boot-gate-secret
          ENABLE_CELERY: "0"
          ENABLE_QLIB: "0"
          ENABLE_RD_AGENT: "0"
          MESH_ENABLED: "0"
          PERCEPTION_ENABLED: "0"
          TASK_MESSAGE_REDIS_URL: "memory://"
        run: |
          pytest \
            tests/api/test_template_fetch_contract.py \
            tests/api/test_phase_a_route_contract.py \
            tests/api/test_public_api_contract.py \
            tests/infrastructure/test_mysql_signal_observation_repository.py \
            tests/presentation/test_routes_v1_ui.py \
            tests/architecture/test_layer_dependency_gate.py \
            -q --tb=short

  frontend-security:
    name: Security (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: frontend

  openapi-check:
    name: OpenAPI consistency
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[test]" 2>/dev/null || pip install pytest
      - name: Verify openapi.json is up to date
        run: |
          python scripts/generate_openapi.py --output /tmp/openapi.json
          diff -u docs/openapi.json /tmp/openapi.json
        env:
          FLASK_ENV: development
          FLASK_SECRET_KEY: ci-boot-gate-secret
          ENABLE_CELERY: "0"
          ENABLE_QLIB: "0"
          ENABLE_RD_AGENT: "0"
          MESH_ENABLED: "0"
          PERCEPTION_ENABLED: "0"
          ENABLE_SOCKETIO: "0"
          TUSHARE_TOKEN: ""
          TASK_MESSAGE_REDIS_URL: "memory://"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [compile, test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: pip install -e . 2>/dev/null || pip install flask
      - name: Build frontend for SPA E2E
        run: |
          cd frontend && npm ci && npm run build
      - name: Install Playwright
        run: |
          cd tests/e2e && npm ci
          npx playwright install chromium --with-deps
      - name: Start Flask server
        run: |
          FLASK_ENV=development SESSION_COOKIE_SECURE=0 \
          ENABLE_CELERY=0 ENABLE_QLIB=0 ENABLE_RD_AGENT=0 MESH_ENABLED=0 PERCEPTION_ENABLED=0 \
          ENABLE_SOCKETIO=0 FLASK_SECRET_KEY=ci-boot-gate-secret \
          python -c "from app import create_app; app = create_app(); app.run(host='127.0.0.1', port=5000)" &
          sleep 15
      - name: Run Playwright tests
        run: cd tests/e2e && npx playwright test specs/04_health_check.spec.ts specs/01_login.spec.ts
        env:
          E2E_NO_GLOBAL_SETUP: "1"
          FLASK_ENV: development
          SESSION_COOKIE_SECURE: "0"
          E2E_USERNAME: admin
          E2E_PASSWORD: admin123
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
