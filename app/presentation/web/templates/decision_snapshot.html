{% extends "base.html" %}
{% block spa_switcher %}
<a href="/app/decision-snapshot" class="spa-switcher-link"
   data-spa-switcher="decision-snapshot">
  试试新版 →
</a>
{% endblock %}

{% block title %}决策快照 · {{ snapshot_id }}{% endblock %}

{% block content %}
<section class="section-shell">
    <div class="panel-head d-flex flex-wrap justify-content-between gap-2">
        <div>
            <h1 class="panel-title mb-0">决策快照复盘</h1>

            <div class="panel-subtitle text-muted">封存时刻的市场全景，非实时行情</div>

        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn-soft btn-sm" id="copyShareBtn">复制分享链接</button>
            <a class="btn-soft btn-sm" id="openStockLink" href="/self-stocks">打开标的</a>
            <a class="btn-soft btn-sm" href="/strategy-snapshots?tab=decision">快照列表</a>
        </div>
    </div>

    <div id="snapshotMeta" class="text-muted text-sm mt-2">加载中...</div>

    <div id="snapshotBrief" class="mt-3"></div>
    <div id="snapshotReports" class="mt-3"></div>
    <div id="snapshotEvidence" class="mt-3"></div>
</section>
{% endblock %}

{% block extra_js %}
<script nonce="{{ csp_nonce() }}">
const SNAP_ID = {{ snapshot_id|tojson }};

function escHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderReports(citations) {
    const box = document.getElementById('snapshotReports');
    if (!citations || !citations.length) {
        box.innerHTML = '';
        return;
    }
    box.innerHTML = '<h3 class="panel-title">研报原文摘要</h3>' + citations.map(function (c) {
        const link = c.report_url
            ? '<a href="' + escHtml(c.report_url) + '" target="_blank" rel="noopener">原文</a>'
            : '';
        return '<div class="assistant-card mt-2"><strong>' + escHtml(c.title) + '</strong> ' +
            escHtml(c.org_name || '') + ' · ' + escHtml(c.pub_date || '') + ' ' + link +
            '<div class="text-muted text-sm mt-1">' + escHtml(c.excerpt || '') + '</div></div>';
    }).join('');
}

function renderEvidence(ev) {
    const box = document.getElementById('snapshotEvidence');
    if (!ev || !ev.factors || !ev.factors.length) {
        box.innerHTML = '';
        return;
    }

    box.innerHTML = '<h3 class="panel-title">证据链（封存</h3>' + ev.factors.map(function (f) {

        const pct = f.percentile_250d != null ? ' · 分位 ' + f.percentile_250d + '%' : '';
        return '<div class="assistant-card mt-2"><strong>' + escHtml(f.name) + '</strong> ' +
            escHtml(f.value) + escHtml(f.unit || '') + pct +
            '<div class="text-muted text-sm mt-1">' + escHtml(f.interpretation || '') + '</div></div>';
    }).join('');
}

function renderBrief(brief) {
    const h = brief.header || {};
    document.getElementById('snapshotBrief').innerHTML =
        '<div class="assistant-card"><strong>' + escHtml(h.name || brief.symbol) + '</strong>' +

        '<div class="mt-2">结论:<span class="ra-pill">' + escHtml(brief.verdict || (brief.supporting_evidence || {}).one_line_verdict || '—') + '</span></div>' +

        '<div class="text-muted text-sm mt-2">价格 ' + escHtml(h.price) + ' · 涨跌 ' + escHtml(h.change_pct) + '%</div></div>';
    const ev = brief.supporting_evidence || {};
    renderReports(ev.report_citations || []);
    renderEvidence(ev);
}

fetch('/api/v1/decision/snapshots/' + encodeURIComponent(SNAP_ID), { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (json) {
        const snap = json.data || json.snapshot || json;
        const created = snap.created_at || '';
        document.getElementById('snapshotMeta').textContent =
            (snap.label || snap.symbol) + ' · ' + created + ' · by ' + (snap.created_by || '');
        const stockLink = document.getElementById('openStockLink');
        if (stockLink && snap.symbol) {
            stockLink.href = '/stock/' + encodeURIComponent(snap.symbol) + '?m=' + encodeURIComponent(snap.market || 'CN');
            stockLink.textContent = '当前行情 · ' + snap.symbol;
        }
        const copyBtn = document.getElementById('copyShareBtn');
        if (copyBtn) {
            copyBtn.onclick = function () {
                const urls = [window.location.href];
                if (snap.share_public_path) {
                    urls.push(window.location.origin + snap.share_public_path);
                }
                const text = urls.join('\n');
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(function () {
                        alert('已复制复盘链鎺? + (snap.share_public_path ? '与只读外閾? : ''));
                    });
                } else {
                    prompt('复制链接', text);
                }
            };
        }
        renderBrief(snap.decision_brief || {});
    })
    .catch(function () {
        document.getElementById('snapshotMeta').textContent = '快照加载失败';
    });
</script>
{% endblock %}
