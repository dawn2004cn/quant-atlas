<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Quant Atlas{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
    <link rel="stylesheet" href="{{ versioned_url('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/errors.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}minimal-shell-body{% endblock %}">
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <main class="page-wrap page-wrap--minimal" id="mainContent">
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
