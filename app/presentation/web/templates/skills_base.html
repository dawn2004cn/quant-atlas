<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-color-scheme="{{ 'us' if (ui_color_scheme or 'cn') == 'us' else 'cn' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script nonce="{{ csp_nonce() }}">(function(){var t=localStorage.getItem('theme');var light=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches;if(t){document.documentElement.setAttribute('data-theme',t)}else if(light){document.documentElement.setAttribute('data-theme','light');t='light'}else{t='dark'}var bg=t==='light'?'#f6f8fb':'#07111f';var fg=t==='light'?'#0f172a':'#eef6ff';document.documentElement.style.backgroundColor=bg;document.documentElement.style.color=fg;document.documentElement.style.colorScheme=t})();</script>
    <title>{% block title %}技能广场 - Quant Atlas{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/vendor/bootstrap-4.6.2.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
    <link rel="stylesheet" href="{{ versioned_url('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body hx-boost="true" {% block body_element_attrs %}data-qa-focus-refresh="auto" data-nav-endpoint="{{ request.endpoint or '' }}"{% endblock %}>
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <div class="app-shell">
        <nav class="app-nav">
            <a class="brand-mark" href="/">
                <span class="brand-badge">Q</span>
                <span class="brand-copy">
                    <span class="brand-title">Quant Atlas</span>
                    <span class="brand-subtitle">技能广场</span>
                </span>
            </a>
            <button class="nav-toggle" type="button" id="navToggleBtn" aria-label="展开或收起导航菜单" aria-expanded="false">
                <span class="nav-toggle-icon" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <div class="nav-items">
                <a class="nav-pill {% if request.endpoint == 'pages.index' %}active{% endif %}" href="/" data-nav-label="首页">🏠 首页</a>
                <a class="nav-pill {% if request.endpoint == 'skills.marketplace' %}active{% endif %}" href="{{ url_for('skills.marketplace') }}" data-nav-label="技能广场">🛠️ 技能广场</a>
                <a class="nav-pill {% if request.endpoint == 'skills.installed' %}active{% endif %}" href="{{ url_for('skills.installed') }}" data-nav-label="已安装">📦 已安装</a>
            </div>
        </nav>
        <main class="app-main" id="mainContent" role="main">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script defer src="{{ url_for('static', filename='js/vendor/jquery-3.7.1.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/vendor/bootstrap-4.6.2.bundle.min.js') }}"></script>
    <script defer src="{{ versioned_url('static', filename='js/base_app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
