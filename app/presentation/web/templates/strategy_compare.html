{% extends "base.html" %}
{% block spa_switcher %}
<a href="/app/strategy-compare" class="spa-switcher-link"
   data-spa-switcher="strategy-compare">
  试试新版 →
</a>
{% endblock %}

{% block title %}策略对比 - Quant Atlas{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/strategy.css') }}">
{% endblock %}

{% block content %}
<div class="section-shell">
    <div class="compare-header">
        <div>
            <div class="hero-caption">Strategy Comparison</div>
            <h1 class="page-title">📊 策略对比分析</h1>
        </div>
        <a class="btn-soft" href="/run-history">鈫?返回历史</a>
    </div>
    
    <div class="section-shell mb-6 sc-compare-hero">
        <div class="panel-head mb-4">
            <h2 class="panel-title">📈 收益曲线对比</h2>
        </div>
        <div class="compare-chart" id="compareChart"></div>
        <div class="equity-legend" id="legend"></div>
    </div>
    
    <div class="compare-cards" id="compareCards">
        <!-- Compare cards will be rendered here -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/vendor/echarts.min.js') }}"></script>
<script nonce="{{ csp_nonce() }}">
const COLORS = ['#7c3aed', '#3b82f6', '#f59e0b', '#10b981', '#ef4444'];
let strategies = [];

function parseCompareParams() {
    const params = new URLSearchParams(window.location.search);
    const symbol = params.get('symbol') || '600519';
    const raw = params.get('strategies') || params.get('strategy') || 'MA,RSI,MACD';
    const list = raw.split(',').map(s => s.trim()).filter(Boolean).slice(0, 5);
    const end = params.get('end') || new Date().toISOString().slice(0, 10);
    const startDate = new Date();
    startDate.setFullYear(startDate.getFullYear() - 1);
    const start = params.get('start') || startDate.toISOString().slice(0, 10);
    return { symbol, strategies: list, start, end };
}

function pctNum(value) {
    const n = Number(value);
    if (Number.isNaN(n)) return 0;
    return Math.abs(n) <= 1 ? n * 100 : n;
}

function loadStrategyCompare() {
    const cfg = parseCompareParams();
    $('#compareCards').html('<div class="empty-state">正在回测对比策略鈥?/div>');
    fetch('/api/v1/strategies/backtest/compare', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            symbol: cfg.symbol,
            strategies: cfg.strategies,
            start_date: cfg.start,
            end_date: cfg.end,
            initial_capital: 100000,
        }),
    })
        .then(res => res.json())
        .then(json => {
            const data = json.data || json.compare_result || json;
            const rows = data.comparisons || [];
            strategies = rows.map((row, idx) => ({
                id: row.strategy_name,
                name: row.strategy_name,
                color: COLORS[idx % COLORS.length],
                returns: pctNum(row.total_return),
                sharpe: Number(row.sharpe || 0),
                maxdd: -Math.abs(pctNum(row.max_drawdown)),
                winrate: pctNum(row.win_rate),
                trades: Number(row.trade_count || 0),
                status: row.status,
                error: row.error,
            }));
            if (!strategies.length) {
                $('#compareCards').html('<div class="empty-state">无对比结鏋?/div>');
                return;
            }
            renderCompareCards();
            renderCompareChart();
        })
        .catch(() => {
            $('#compareCards').html('<div class="empty-state">策略对比加载失败</div>');
        });
}

$(document).ready(function() {
    loadStrategyCompare();
});

function renderCompareCards() {
    let html = '';
    
    strategies.sort((a, b) => b.returns - a.returns);
    const bestReturn = strategies[0].returns;
    const bestSharpe = Math.max(...strategies.map(s => s.sharpe));
    const bestWinrate = Math.max(...strategies.map(s => s.winrate));
    
    strategies.forEach((s, idx) => {
        if (s.status === 'error') {
            html += `<div class="compare-card"><div class="strategy-name">${s.name}</div><div class="text-danger mt-2">${s.error || '回测失败'}</div></div>`;
            return;
        }
        html += `<div class="compare-card">
            <div class="compare-card-header">
                <div>
                    <span class="strategy-name">${s.name}</span>
                    ${idx === 0 ? '<span class="winner-badge ml-2">收益最楂?/span>' : ''}
                </div>
                <span class="strategy-badge">${s.trades} 笔交鏄?/span>
            </div>
            <div class="compare-metrics">
                <div class="metric-box ${s.returns === bestReturn ? 'highlight' : ''}">
                    <div class="metric-val ${s.returns >= 0 ? 'positive' : 'negative'}">${s.returns > 0 ? '+' : ''}${s.returns}%</div>
                    <div class="metric-label">总收鐩?/div>
                </div>
                <div class="metric-box ${s.sharpe === bestSharpe ? 'highlight' : ''}">
                    <div class="metric-val">${s.sharpe}</div>
                    <div class="metric-label">夏普比率</div>
                </div>
                <div class="metric-box">
                    <div class="metric-val negative">${s.maxdd}%</div>
                    <div class="metric-label">最大回鎾?/div>
                </div>
                <div class="metric-box ${s.winrate === bestWinrate ? 'highlight' : ''}">
                    <div class="metric-val">${s.winrate}%</div>
                    <div class="metric-label">胜率</div>
                </div>
            </div>
        </div>`;
    });
    
    $('#compareCards').html(html);
}

function renderCompareChart() {
    const dates = [];
    for (let i = 0; i < 60; i++) {
        const d = new Date();
        d.setDate(d.getDate() - (60 - i));
        dates.push(d.toISOString().split('T')[0]);
    }
    
    const series = strategies.filter(s => s.status !== 'error').map(s => {
        const endVal = 100 * (1 + s.returns / 100);
        const data = dates.map((_, i) => {
            if (dates.length <= 1) return 100;
            return 100 + (endVal - 100) * (i / (dates.length - 1));
        });
        return {
            name: s.name,
            type: 'line',
            data: data,
            smooth: true,
            lineStyle: { width: 3, color: s.color },
            symbol: 'none'
        };
    });
    
    const chart = echarts.init(document.getElementById('compareChart'));
    chart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { top: 20, bottom: 30, left: 50, right: 30 },
        xAxis: { type: 'category', data: dates, boundaryGap: false },
        yAxis: { type: 'value', scale: true, name: '净鍊? },
        series: series
    });
    
    // Legend
    let legendHtml = '';
    strategies.forEach(s => {
        legendHtml += `<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${s.name}</div>`;
    });
    $('#legend').html(legendHtml);
}
</script>
{% endblock %}
