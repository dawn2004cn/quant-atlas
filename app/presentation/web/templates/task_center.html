{% extends "base.html" %}

{% block title %}任务中心 - Quant Atlas{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/system.css') }}">
{% endblock %}

{% block spa_switcher %}
<a href="/app/task-center" class="spa-switcher-link"
   data-spa-switcher="task-center">
  试试新版 →
</a>
{% endblock %}

{% block content %}
<div class="task-center" id="mainContent">
    <div class="task-hero">
        <h1>🎯 任务中心</h1>
        <p>管理后台任务，执行数据同步、市场数据更新、信号扫描等任务</p>
        <div id="tcActiveJobs" class="mt-3 tc-jobs-sm"></div>
    </div>

    <div class="sync-toggle">
        <input type="checkbox" id="syncMode">
        <label for="syncMode">同步执行（立即返回结果）</label>
        <span class="tc-hint-muted">不勾选则异步执行任务</span>
    </div>

    <div id="tasksContainer">
        <div class="task-category">
            <div class="task-category-title"><span class="icon">⏳</span> 加载中...</div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/task_feedback.js') }}"></script>
<script nonce="{{ csp_nonce() }}">
const API_BASE = '/api/v1';
const taskRegistryMap = {};

function escHtml(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadTasks() {
    try {
        const resp = await fetch(API_BASE + '/tasks', { credentials: 'include' });
        const data = await resp.json();
        renderTasks(data.data.tasks || {});
    } catch(e) {
        window.qcLogError('loadTasks error', e);
        document.getElementById('tasksContainer').innerHTML = '<div class="empty-tasks">加载任务失败: ' + e.message + '</div>';
    }
}

function renderTasks(tasksByCategory) {
    const container = document.getElementById('tasksContainer');
    if (!tasksByCategory || Object.keys(tasksByCategory).length === 0) {
        container.innerHTML = '<div class="empty-tasks">暂无可用任务</div>';
        return;
    }

    const categoryIcons = {
        '数据同步': '💾',
        '市场数据': '📈',
        '新闻': '📰',
        '信号': '🎯',
        '投资经理': '👤',
        '社交': '💬',
    };

    let html = '';
    for (const [category, tasks] of Object.entries(tasksByCategory)) {
        const icon = categoryIcons[category] || '📋';
        html += `
            <div class="task-category">
                <div class="task-category-title"><span class="icon">${icon}</span> ${category}</div>
                <div class="task-grid">
        `;
        for (const task of tasks) {
            taskRegistryMap[task.name] = task;
            const paramsStr = Object.entries(task.default_params || {})
                .map(([k,v]) => `${k}=${v}`).join(', ');
            const steps = task.estimated_steps || [];
            const stepsHtml = steps.length
                ? '<div class="qc-task-steps tc-steps-mt">' +
                  steps.map(function (s) { return '<span class="qc-task-step">' + escHtml(s) + '</span>'; }).join('') +
                  '</div>'
                : '';
            html += `
                <div class="task-card" id="card-${task.name.replace(/\./g, '-')}">
                    <div class="task-card-header">
                        <div class="task-name">${task.name.split('.').pop()}</div>
                    </div>
                    <div class="task-card-body">${task.description || '无描述'}${stepsHtml}</div>
                    <div class="task-card-footer">
                        <div class="task-params">默认: <code>${paramsStr || '无'}</code></div>
                        <button class="btn-run" type="button" data-tc-action="run-task" data-task-name="${task.name}" data-card-id="${task.name.replace(/\./g, '-')}">🚀 执行</button>
                    </div>
                    <div class="task-result" id="result-${task.name.replace(/\./g, '-')}"></div>
                </div>
            `;
        }
        html += '</div></div>';
    }
    container.innerHTML = html;
}

async function runTask(taskName, cardId) {
    const syncMode = document.getElementById('syncMode').checked;
    const resultEl = document.getElementById('result-' + cardId);
    const btn = document.querySelector(`#card-${cardId} .btn-run`);
    const meta = taskRegistryMap[taskName] || {};
    const defaultParams = meta.default_params || {};

    btn.disabled = true;
    resultEl.className = 'task-result loading';
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<span class="loading-spinner"></span> 执行中...';

    function bindAsyncProgress(taskId, resolvedName) {
        resultEl.className = 'task-result loading';
        resultEl.innerHTML = '<div>✅ 任务已提交 · Task ID: ' + escHtml(taskId) + '</div>' +
            '<div id="progress-' + cardId + '"></div>';
        const progressEl = document.getElementById('progress-' + cardId);
        if (window.QCTaskFeedback && progressEl) {
            QCTaskFeedback.watch(taskId, {
                element: progressEl,
                taskName: resolvedName,
                onComplete: function (fb) {
                    resultEl.className = fb.successful ? 'task-result success' : 'task-result error';
                    if (fb.successful) {
                        resultEl.innerHTML = '✅ 执行完成<div id="progress-' + cardId + '"></div>' +
                            (fb.result_preview ? '<pre class="tc-pre">' +
                            escHtml(String(fb.result_preview).slice(0, 500)) + '</pre>' : '');
                        QCTaskFeedback.renderProgress(document.getElementById('progress-' + cardId), fb);
                    } else {
                        resultEl.innerHTML = '❌ ' + escHtml(fb.message || '任务失败') +
                            '<div id="progress-' + cardId + '"></div>';
                        QCTaskFeedback.renderProgress(document.getElementById('progress-' + cardId), fb);
                    }
                    if (window.QAUserCenter) {
                        QAUserCenter.mountActiveJobsPanel('tcActiveJobs', 6);
                    }
                }
            });
        } else {
            resultEl.className = 'task-result success';
            resultEl.innerHTML = '✅ 任务已提交<br>Task ID: ' + (taskId || 'N/A');
        }
    }

    try {
        if (!syncMode && window.QAUserCenter && window.QCTaskFeedback) {
            resultEl.innerHTML =
                '<div class="tc-task-submitted">正在提交任务…</div><div id="progress-' + cardId + '"></div>';
            const data = await QAUserCenter.runRegisteredTask(taskName, defaultParams, {
                element: document.getElementById('progress-' + cardId),
                onStarted: function (started) {
                    if (started && started.task_id) {
                        const head = resultEl.querySelector('.tc-task-submitted');
                        if (head) {
                            head.textContent = '✅ 任务已提交 · Task ID: ' + started.task_id;
                        }
                    }
                },
                onComplete: function (fb) {
                    if (!fb) return;
                    resultEl.className = fb.successful ? 'task-result success' : 'task-result error';
                    const progressHtml = '<div id="progress-' + cardId + '"></div>';
                    if (fb.successful) {
                        resultEl.innerHTML =
                            '<div class="tc-task-submitted">✅ 执行完成</div>' + progressHtml +
                            (fb.result_preview
                                ? '<pre class="tc-pre">' +
                                  escHtml(String(fb.result_preview).slice(0, 500)) + '</pre>'
                                : '');
                    } else {
                        resultEl.innerHTML =
                            '<div class="tc-task-submitted">❌ ' + escHtml(fb.message || '任务失败') + '</div>' +
                            progressHtml;
                    }
                    QCTaskFeedback.renderProgress(
                        document.getElementById('progress-' + cardId),
                        fb
                    );
                    if (window.QAUserCenter) {
                        QAUserCenter.mountActiveJobsPanel('tcActiveJobs', 6);
                    }
                },
            });
            if (data && data.task_id) {
                const head = resultEl.querySelector('.tc-task-submitted');
                if (head) head.textContent = '✅ 任务已提交 · Task ID: ' + data.task_id;
            } else if (data && data.mode !== 'async') {
                const resultStr = JSON.stringify(data, null, 2).substring(0, 500);
                resultEl.className = 'task-result success';
                resultEl.innerHTML =
                    '✅ 执行完成<br><pre class="tc-pre">' +
                    escHtml(resultStr) + '</pre>';
            }
            return;
        }

        const resp = await fetch(API_BASE + '/tasks/run', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify({
                task_name: taskName,
                sync: syncMode,
                params: defaultParams
            })
        });
        const data = await resp.json();

        if (data.error) {
            resultEl.className = 'task-result error';
            resultEl.innerHTML = '❌ ' + data.error;
        } else if (data.data && data.data.mode === 'async') {
            bindAsyncProgress(data.data.task_id, data.data.task_name || taskName);
        } else {
            const resultStr = JSON.stringify(data.data, null, 2).substring(0, 500);
            resultEl.className = 'task-result success';
            resultEl.innerHTML = '✅ 执行完成<br><pre class="tc-pre">' + resultStr + '</pre>';
        }
    } catch(e) {
        resultEl.className = 'task-result error';
        resultEl.innerHTML = '❌ ' + e.message;
    } finally {
        btn.disabled = false;
    }
}

document.addEventListener('DOMContentLoaded', function () {
    loadTasks();
    document.addEventListener('click', function (e) {
        const el = e.target.closest('[data-tc-action]');
        if (!el || el.dataset.tcAction !== 'run-task') return;
        runTask(el.dataset.taskName || '', el.dataset.cardId || '');
    });
    if (window.QAUserCenter) {
        QAUserCenter.mountActiveJobsPanel('tcActiveJobs', 6);
        setInterval(function () {
            QAUserCenter.mountActiveJobsPanel('tcActiveJobs', 6);
        }, 10000);
    }
});
</script>
{% endblock %}
