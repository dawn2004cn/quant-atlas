{% extends "base.html" %}{% block spa_switcher %}
{% block spa_switcher %}

<a href="/app/user-tiers/boutique" class="spa-switcher-link"
   data-spa-switcher="user-tiers/boutique">

  试试新版 →

</a>

{% endblock %}
{% endblock %}

{% block title %}量化工坊{% endblock %}{% block content %}
<div class="container mt-4">
  <h2>🔬 量化工坊</h2>
  <div class="row mt-3">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">🧬 自动因子挖掘 (GP进化)</div>
        <div class="card-body">
          <div class="form-group"><label>种群规模</label><input class="form-control" id="popSize" value="30"></div>
          <div class="form-group"><label>进化代数</label><input class="form-control" id="generations" value="10"></div>
          <button class="btn btn-success" type="button" data-ut-action="runEvolution">开始进化</button>
          <div id="factorResult" class="mt-3"></div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">⚡ 向量化回测</div>
        <div class="card-body">
          <button class="btn btn-primary" type="button" data-ut-action="runBacktest">运行回测</button>
          <div id="backtestResult" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script nonce="{{ csp_nonce() }}">
async function postJSON(url, data) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':'{{csrf_token()}}'}, body: JSON.stringify(data||{})});
  return r.json();
}
async function runEvolution() {
  const pop = parseInt(document.getElementById('popSize').value);
  const gen = parseInt(document.getElementById('generations').value);
  const r = await postJSON('/api/v1/user-tiers/boutique/factor-mining/evolve', {population_size: pop, generations: gen});
  document.getElementById('factorResult').innerHTML = '<pre>' + JSON.stringify(r, null, 2) + '</pre>';
}
async function runBacktest() {
  const r = await postJSON('/api/v1/user-tiers/boutique/backtest/run', {strategy_id:'demo', returns:[0.01,0.02,-0.01,0.03], signals:[1,1,-1,1]});
  document.getElementById('backtestResult').innerHTML = '<pre>' + JSON.stringify(r, null, 2) + '</pre>';
}
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-ut-action]');
  if (!el) return;
  const fn = window[el.dataset.utAction];
  if (typeof fn === 'function') fn();
});
</script>
{% endblock %}
