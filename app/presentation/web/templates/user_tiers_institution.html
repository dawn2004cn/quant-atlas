{% extends "base.html" %}{% block title %}鏈烘瀯绾ф帶鍒跺彴{% endblock %}{% block spa_switcher %}
<a href="/app/user-tiers/institution" class="spa-switcher-link"
   data-spa-switcher="user-tiers/institution">
  璇曡瘯鏂扮増 鈫?
</a>
{% endblock %%}

{% block content %}
<div class="container mt-4">
  <h2>馃悑 鏈烘瀯绾ф帶鍒跺彴</h2>
  <div class="row mt-3">
    <div class="col-md-6">
      <div class="card"><div class="card-header">馃搱 鍐插嚮鎴愭湰棰勬祴 (Almgren-Chriss)</div>
        <div class="card-body"><button class="btn btn-primary" type="button" data-ut-action="runImpact">棰勬祴鍐插嚮</button><div id="impactResult" class="mt-3"></div></div></div>
    </div>
    <div class="col-md-6">
      <div class="card"><div class="card-header">鈿?鑷€傚簲鎵ц绠楁硶</div>
        <div class="card-body"><button class="btn btn-info" type="button" data-ut-action="runExecution">鐢熸垚鎵ц璁″垝</button><div id="execResult" class="mt-3"></div></div></div>
    </div>
    <div class="col-md-6 mt-3">
      <div class="card"><div class="card-header">馃敀 鑱旈偊閮ㄧ讲</div>
        <div class="card-body"><button class="btn btn-success" type="button" data-ut-action="runFederated">妫€鏌ラ泦缇?/button><div id="fedResult" class="mt-3"></div></div></div>
    </div>
    <div class="col-md-6 mt-3">
      <div class="card"><div class="card-header">馃泜 RBAC 鏉冮檺</div>
        <div class="card-body"><button class="btn btn-warning" type="button" data-ut-action="runRBAC">鏌ョ湅鏉冮檺</button><div id="rbacResult" class="mt-3"></div></div></div>
    </div>
  </div>
</div>
<script nonce="{{ csp_nonce() }}">
async function postJSON(url, data) {
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':'{{csrf_token()}}'}, body: JSON.stringify(data||{})});
  return r.json();
}
async function runImpact() {
  const r = await postJSON('/api/v1/user-tiers/institution/impact/almgren-chriss', {symbol:'AAPL',order_value_usd:10000000,side:'buy',price:150});
  document.getElementById('impactResult').innerHTML = '<pre>' + JSON.stringify(r, null, 2) + '</pre>';
}
async function runExecution() {
  const r = await postJSON('/api/v1/user-tiers/institution/execution/adaptive', {symbol:'AAPL',side:'buy',total_quantity:10000,impact_bps:30,urgency:'stealth'});
  document.getElementById('execResult').innerHTML = '<pre>' + JSON.stringify(r, null, 2) + '</pre>';
}
async function runFederated() {
  const r = await fetch('/api/v1/user-tiers/institution/federated/status');
  const d = await r.json();
  document.getElementById('fedResult').innerHTML = '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
}
async function runRBAC() {
  const r = await fetch('/api/v1/user-tiers/institution/rbac/me');
  const d = await r.json();
  document.getElementById('rbacResult').innerHTML = '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
}
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-ut-action]');
  if (!el) return;
  const fn = window[el.dataset.utAction];
  if (typeof fn === 'function') fn();
});
</script>
{% endblock %}
