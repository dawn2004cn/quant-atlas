# 业务逻辑与非敏感默认值（UTF-8）。
# 核心连接、密钥、后端切换请在 .env 中设置，.env 优先级高于此文件。

[app]
# UI 与显示
UI_COLOR_SCHEME = cn
ENABLE_API_LEGACY_RESPONSE_FIELDS = 0

# 定时任务开关 (Celery Beat 注册项)
# 建议在生产环境中根据机器角色开启/关闭
BASIC_DATA_LONGHU_BEAT = 1
BASIC_DATA_YANBAO_BEAT = 1
NEWS_DAILY_BEAT = 1
SCANNER_CELERY_BEAT = 1
QLIB_CELERY_BEAT = 0
# A 股 TDX 日 K 收盘后增量：16:05 sync_incremental_tdx，16:25 mysql_to_qlib（见 TDX_DAYK_BEAT_*）
TDX_DAYK_CELERY_BEAT = 0
# mysql_to_qlib_incremental_sync 仅重导最近 N 天有更新的标的
QLIB_MYSQL_BIN_DAYS_LOOKBACK = 10
DATA_BACKFILL_BEAT = 0
FINANCIAL_DAILY_BEAT = 0
NEWS_ARCHIVE_BACKFILL_BEAT = 0
FACTOR_IC_CELERY_BEAT = 0
INVESTMENT_MANAGERS_CELERY_BEAT = 1

# 通达信本地日线解析配置
TDX_HISTORY_TCP_MAX_PAGES = 6
TDX_HISTORY_TCP_PAGE_SIZE = 800
TDX_HISTORY_CACHE_FALLBACK_LIMIT = 4000
ALLOW_ONLINE_HISTORY_FALLBACK = 1
ALLOW_TDX_LIVE_HISTORY_READ = 0

# 回测风控参数 (全局默认)
RISK_STOP_LOSS_PCT = -0.08
RISK_VOL_MA_WINDOW = 10
RISK_VOL_RATIO_MIN = 1.2
RISK_VOLAT_WINDOW = 20
RISK_VOLAT_MIN = 0.01
RISK_SENTIMENT_GATE = 1
RISK_SENTIMENT_MIN_SCORE = 50
RISK_BACKTEST_SENTIMENT_GATE = 1
RISK_TRAILING_ATR = 1
RISK_ATR_WINDOW = 14
RISK_ATR_MULT = 3.0

# 交易成本与滑点
BT_SLIPPAGE_BPS = 8
BT_OPEN_COMMISSION = 0.0003
BT_CLOSE_COMMISSION = 0.0003
BT_STAMP_DUTY = 0.001
BT_MIN_FEE = 5

# 仓位管理
BT_POSITION_SIZING_MODE = hybrid
BT_MAX_WEIGHT = 0.2
BT_RISK_PER_TRADE = 0.01
BT_CN_LOT_SIZE = 100
BT_MAX_POSITIONS = 5
BT_LIMIT_THRESHOLD = 0.095

# 业务抓取细节
NEWS_BACKFILL_MAX_CODES = 1200
NEWS_BACKFILL_SLEEP_SEC = 0.45
YANBAO_FULL_MAX_ROWS = 500
FINANCIAL_DAILY_MAX_CODES = 120
FACTOR_IC_WARN = 0.05

# AI / LLM 默认模型 (具体 API Key 请放在 .env)
OLLAMA_BASE_URL = http://127.0.0.1:11434
OLLAMA_MODEL = qwen2.5:7b
TRADING_AGENTS_TEMPERATURE = 0.2
TRADING_AGENTS_TIMEOUT_SEC = 120
