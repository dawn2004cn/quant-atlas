_format_version: "3.0"
services:
  - name: market-data-service
    url: http://market-data:5101
    routes:
      - name: market-data
        paths:
          - /api/v1/market
        strip_path: false
    plugins:
      - name: cors
      - name: rate-limiting
        config:
          minute: 100
          policy: local
      - name: jwt
        config:
          claims_to_verify:
            - nbf
            - exp
          key_claim_name: "iss"
          secret_is_base64: false
          run_on_preflight: true

