apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: quant-atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-agent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: quant-atlas/ai-agent:latest
          ports:
            - containerPort: 5301
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: quant-atlas-config
                  key: REDIS_URL
            - name: MYSQL_URL
              value: "mysql://quant_service:${DB_PASSWORD}@mysql-master:3306/quant_atlas"
            - name: SERVICE_PORT
              value: "5301"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quant-atlas-secrets
                  key: OPENAI_API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 5301
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5301
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
