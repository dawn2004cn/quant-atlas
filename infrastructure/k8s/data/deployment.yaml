apiVersion: apps/v1
kind: Deployment
metadata:
  name: data
  namespace: quant-atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data
  template:
    metadata:
      labels:
        app: data
    spec:
      containers:
        - name: data
          image: quant-atlas/data:latest
          ports:
            - containerPort: 5701
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: quant-atlas-config
                  key: REDIS_URL
            - name: MYSQL_URL
              valueFrom:
                configMapKeyRef:
                  name: quant-atlas-config
                  key: MYSQL_URL
            - name: SERVICE_PORT
              value: "5701"
          livenessProbe:
            httpGet:
              path: /health
              port: 5701
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5701
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
