apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: quant-atlas
  labels:
    app: market-data
    service: market-data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market-data
  template:
    metadata:
      labels:
        app: market-data
        service: market-data
    spec:
      containers:
        - name: market-data
          image: quant-atlas/market-data:latest
          ports:
            - containerPort: 5101
              name: http
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: quant-atlas-config
                  key: REDIS_URL
            - name: MYSQL_URL
              valueFrom:
                configMapKeyRef:
                  name: quant-atlas-config
                  key: MYSQL_URL
            - name: SERVICE_PORT
              value: "5101"
          livenessProbe:
            httpGet:
              path: /health
              port: 5101
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5101
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
