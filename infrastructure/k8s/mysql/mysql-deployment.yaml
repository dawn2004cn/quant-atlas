apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-master
  namespace: quant-atlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
      role: master
  template:
    metadata:
      labels:
        app: mysql
        role: master
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quant-atlas-secrets
                  key: DB_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: quant_atlas
            - name: MYSQL_USER
              value: quant_service
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quant-atlas-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
