apiVersion: apps/v1
kind: Deployment
metadata:
  name: research
  namespace: quant-atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: research
  template:
    metadata:
      labels:
        app: research
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: research
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: quant-atlas/research:latest
          ports:
            - containerPort: 5801
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: quant-atlas-config
                  key: REDIS_URL
            - name: MYSQL_URL
              value: "mysql://quant_service:${DB_PASSWORD}@mysql-master:3306/quant_atlas"
            - name: SERVICE_PORT
              value: "5801"
          livenessProbe:
            httpGet:
              path: /health
              port: 5801
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5801
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
