[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-atlas"
version = "0.1.0"
description = "QuantAtlas quantitative research and trading platform"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "pymysql>=1.1.0",
    "SQLAlchemy>=2.0.0",
    "asyncmy>=0.2.0",
    "alembic>=1.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langchain-core>=0.2.38",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.40",
    "langgraph-prebuilt>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.22",
    "psycopg[binary]>=3.2.0",
    "Flask-Login>=0.6.0",
    "httpx>=0.27.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "akshare>=1.8.0",
    "redis>=4.5.0",
    "cryptography>=41.0.0",
    "yfinance>=0.2.28",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "ta>=0.11.0",
    "tenacity>=8.2.0",
    "pytdx>=1.23.0",
    "questdb>=2.0.0",
    "flask-socketio>=5.3.0",
    "python-socketio>=5.9.0",
    "celery>=5.2.0,<7.0.0",
    "rdagent>=0.8.0",
    "PyJWT[crypto]>=2.8.0",
    "apispec>=6.4.0",
    "apispec-webframeworks>=1.0.0",
]

[project.optional-dependencies]
compute = [
    "polars>=0.20.0",
    'vectorbt>=0.26.0; python_version >= "3.10"',
]
qlib = [
    "pyqlib>=0.9.0",
]
mlops = [
    "mlflow>=2.12.0",
]
ml = [
    "lightgbm>=4.0.0",
]
brokers = [
    "ib_insync>=0.9.86",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
filterwarnings = [
    # Domain entities use datetime.now() — suppress the utcnow deprecation warning
    "ignore:datetime.datetime.utcnow\\(\\):DeprecationWarning",
    # Allow import of deprecated services module from old tests
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Pytest markers (register here so ``pytest --markers`` and CI lint pass)
# ---------------------------------------------------------------------------
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "nightly: marks full-boot / soak tests for scheduled CI only",
    "integration: marks tests that need MySQL/Redis (deselect with '-m \"not integration\"')",
    "qlib: marks tests that need Qlib installed",
    "agent: marks tests that import LangGraph agents",
]

# ---------------------------------------------------------------------------
# Ruff configuration
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP", "S", "BLE", "RUF100"]
ignore = [
    "B017",  # assert-raises-exception — acceptable in tests
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "BLE001"]
"app/presentation/api/routes_v1_*.py" = ["E501", "BLE001"]

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = [
    "tests/**",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
