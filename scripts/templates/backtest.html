{% extends "base.html" %}





{% block title %}策略回测 - Quant Atlas{% endblock %}





{% block extra_css %}


<style>


.backtest-grid { display: grid; gap: 22px; }


.hero-section, .form-panel, .result-panel { padding: 24px; }


.form-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }


.label { display: block; margin-bottom: 8px; font-weight: 700; }


.input-soft, .select-soft {


    width: 100%; border: 1px solid rgba(19,32,45,0.1); border-radius: 18px; padding: 12px 14px; background: rgba(255,255,255,0.86);


}


.metrics-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 18px; }


.metric-box { padding: 18px; border-radius: 18px; background: rgba(255,255,255,0.76); border: 1px solid rgba(19,32,45,0.08); }


.metric-name { color: var(--muted); font-size: 0.84rem; }


.metric-value { font-size: 1.6rem; font-weight: 800; margin-top: 8px; }


.chart-shell { height: 520px; margin-top: 18px; border-radius: 22px; overflow: hidden; background: rgba(255,255,255,0.74); }


.empty-hint { padding: 18px; border-radius: 16px; background: rgba(217,106,43,0.08); color: #7a431d; }


@media (max-width: 1200px) { .form-grid, .metrics-grid { grid-template-columns: 1fr 1fr; } }


@media (max-width: 768px) { .form-grid, .metrics-grid { grid-template-columns: 1fr; } }


</style>


{% endblock %}





{% block content %}


<div class="backtest-grid">


    <section class="section-shell hero-section">


        <div class="hero-caption">Strategy Lab</div>
        <h1 class="page-title">策略回测</h1>
        <p class="page-subtitle">基于K线数据的量化策略回测系统，支持多种技术指标和交易策略，通过 `/api/v1/backtest` 接口实现</p>


    </section>





    <section class="section-shell form-panel">


        <form id="backtestForm">


            <div class="form-grid">


                <div>
                    <label class="label" for="symbol">股票代码</label>
                    <input class="input-soft" id="symbol" value="600519" required>
                </div>
                <div>
                    <label class="label" for="strategy">策略</label>
                    <select id="strategy" class="select-soft">
                        <option value="TDX">TDX 指标策略</option>
                        <option value="MA">MA 均线策略</option>
                        <option value="RSI">RSI 策略</option>
                        <option value="TAU">TAU 策略</option>
                        <option value="DualMA">双均线策略</option>
                        <option value="BollingerRSI">布林带 + RSI</option>
                        <option value="EMAMACD">EMA + MACD</option>
                        <option value="VolumeBreakout">成交量突破</option>
                        <option value="Stochastic">随机指标</option>
                    </select>
                </div>
                <div>
                    <label class="label" for="startDate">开始日期</label>
                    <input class="input-soft" type="date" id="startDate" required>
                </div>
                <div>
                    <label class="label" for="endDate">结束日期</label>
                    <input class="input-soft" type="date" id="endDate" required>
                </div>
                <div>
                    <label class="label" for="initialCapital">初始资金</label>
                    <input class="input-soft" type="number" id="initialCapital" value="100000" min="1000">
                </div>


            </div>


            <div style="margin-top: 18px; display:flex; gap:12px; flex-wrap:wrap;">
                <button class="btn-brand" type="submit">开始回测</button>
                <button class="btn-soft" type="button" onclick="fillQuickRange(180)">近 6 个月</button>
                <button class="btn-soft" type="button" onclick="fillQuickRange(365)">近 1 年</button>
            </div>


        </form>


    </section>





    <section class="section-shell result-panel" id="backtestResult" style="display:none;">


        <div class="panel-head">
            <div>
                <h2 class="panel-title">回测结果</h2>
                <div class="panel-subtitle" id="resultSummaryText">--</div>
            </div>
        </div>


        <div id="backtestHint" class="empty-hint" style="display:none;"></div>


        <div class="metrics-grid" id="metricsGrid"></div>


        <div class="chart-shell" id="resultChart"></div>


        <div class="table-responsive mt-4">


            <table class="table">


                <thead>
                    <tr>
                        <th>日期</th>
                        <th>操作</th>
                        <th>价格</th>
                        <th>数量</th>
                        <th>盈亏</th>
                    </tr>
                </thead>


                <tbody id="resultTrades"></tbody>


            </table>


        </div>


    </section>


</div>


{% endblock %}





{% block extra_js %}


<script src="https://cdn.jsdelivr.net/npm/echarts@5.3.2/dist/echarts.min.js"></script>


<script>


function fillQuickRange(days) {


    const today = new Date();


    const start = new Date();


    start.setDate(today.getDate() - days);


    $('#endDate').val(today.toISOString().split('T')[0]);


    $('#startDate').val(start.toISOString().split('T')[0]);


}





function formatNumber(value, digits = 2) {


    const num = Number(value);


    return Number.isFinite(num) ? num.toFixed(digits) : '--';


}





function metricBox(label, value, cls = '') {
    return `<div class="metric-box"><div class="metric-name">${label}</div><div class="metric-value ${cls}">${value}</div></div>`;
}

function renderTrades(trades) {
    if (!trades || !trades.length) {
        $('#resultTrades').html('<tr><td colspan="5" class="text-center text-muted">暂无交易记录，可能策略未触发交易</td></tr>');
        return;
    }
    $('#resultTrades').html(trades.map(trade => `
        <tr>
            <td>${trade.date || '--'}</td>
            <td class="${trade.action === 'BUY' ? 'positive' : 'negative'}">${trade.action || '--'}</td>
            <td>¥${formatNumber(trade.price)}</td>
            <td>${trade.quantity ?? trade.qty ?? '--'}</td>
            <td class="${Number(trade.profit || 0) >= 0 ? 'positive' : 'negative'}">${trade.profit !== undefined ? '¥' + formatNumber(trade.profit) : '--'}</td>
        </tr>
    `).join(''));
}





function renderChart(result) {
    const stockData = result.stock_data || {};
    const dates = stockData.dates || [];
    const closes = stockData.closes || [];
    const trades = result.trades || [];
    const chart = echarts.init(document.getElementById('resultChart'));

    if (!dates.length) {
        chart.setOption({ title: { text: '无数据可用', left: 'center', top: 'middle' } });
        return;
    }

    const buyPoints = [];
    const sellPoints = [];
    trades.forEach(trade => {
        const idx = dates.indexOf(trade.date);
        if (idx >= 0) {
            const point = [idx, trade.price];
            if (trade.action === 'BUY') buyPoints.push(point);
            if (trade.action === 'SELL') sellPoints.push(point);
        }
    });

    chart.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['收盘价', '买入', '卖出'], top: 12 },
        grid: { left: 48, right: 24, top: 56, bottom: 36 },
        xAxis: { type: 'category', data: dates, boundaryGap: false },
        yAxis: { type: 'value', scale: true },
        series: [
            { name: '收盘价', type: 'line', smooth: true, data: closes, lineStyle: { width: 3, color: '#103f91' }, areaStyle: { color: 'rgba(16,63,145,0.10)' } },
            { name: '买入', type: 'scatter', data: buyPoints, symbolSize: 12, itemStyle: { color: '#c23616' } },
            { name: '卖出', type: 'scatter', data: sellPoints, symbolSize: 12, itemStyle: { color: '#118a55' } },
        ]
    });
}





function displayBacktestResult(result) {
    $('#backtestResult').show();
    const totalReturn = Number(result.total_return || 0);
    $('#resultSummaryText').text(`${result.symbol || $('#symbol').val()} · ${result.strategy || $('#strategy').val()} · ${result.period?.start || $('#startDate').val()} 至 ${result.period?.end || $('#endDate').val()}`);
    $('#metricsGrid').html([
        metricBox('最终资产', '¥' + formatNumber(result.final_value), totalReturn >= 0 ? 'positive' : 'negative'),
        metricBox('总收益率', formatNumber(totalReturn) + '%', totalReturn >= 0 ? 'positive' : 'negative'),
        metricBox('年化收益率', formatNumber(result.annual_return) + '%'),
        metricBox('最大回撤', formatNumber(result.max_drawdown) + '%', Number(result.max_drawdown || 0) < 0 ? 'negative' : ''),
        metricBox('夏普比率', formatNumber(result.sharpe_ratio)),
    ].join(''));

    const trades = result.trades || [];
    if (!trades.length) {
        $('#backtestHint').show().text('暂无交易记录，建议尝试其他策略如 TDX 或 DualMA，或调整时间范围');
    } else {
        $('#backtestHint').hide();
    }
    renderTrades(trades);
    renderChart(result);
}





$(function() {


    fillQuickRange(365);


    $('#backtestForm').on('submit', function(event) {


        event.preventDefault();


        const payload = {


            symbol: $('#symbol').val().trim(),


            strategy: $('#strategy').val(),


            start_date: $('#startDate').val(),


            end_date: $('#endDate').val(),


            initial_capital: Number($('#initialCapital').val() || 100000),


        };


        $.ajax({


            url: '/api/v1/backtest',


            method: 'POST',


            contentType: 'application/json',


            data: JSON.stringify(payload),


            success: function(res) {


                displayBacktestResult(res.backtest_result || res.data || {});


            },


            error: function() {


                alert('?????????????');


            }


        });


    });


});


</script>


{% endblock %}
