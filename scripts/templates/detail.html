<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ticker }} - 个股详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a href="/" class="btn btn-outline-secondary btn-sm mb-3">返回首页</a>
            <h2 id="stock-title" class="mb-1">{{ ticker }}</h2>
            <p class="text-muted mb-0" id="stock-summary">正在加载行情与指标...</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div id="mainChart" style="height: 560px;"></div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white">
                    <h5 class="mb-0">相关新闻</h5>
                </div>
                <div class="card-body">
                    <div id="news-list" class="d-flex flex-column gap-3">
                        <div class="text-muted">正在加载相关新闻...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const symbol = "{{ ticker }}";
const chart = echarts.init(document.getElementById('mainChart'));

function normalizeDetail(response) {
    const detail = response.stock || response.data || response;
    const profile = detail.profile || {};
    const realtime = profile.realtime || {};
    const basic = profile.detail || {};
    return {
        name: realtime.name || basic.name || symbol,
        price: Number(realtime.price || basic.price || 0),
        changePct: Number(realtime.change_pct || basic.change_pct || 0),
        news: detail.news || [],
    };
}

function normalizeHistory(response) {
    const history = response.history || response.data || [];
    return Array.isArray(history) ? history : [];
}

function calculateMA(period, rows) {
    return rows.map((_, index) => {
        if (index < period - 1) {
            return null;
        }
        const slice = rows.slice(index - period + 1, index + 1);
        const sum = slice.reduce((total, item) => total + Number(item.close || 0), 0);
        return Number((sum / period).toFixed(2));
    });
}

function renderNews(items) {
    const container = document.getElementById('news-list');
    if (!items.length) {
        container.innerHTML = '<div class="text-muted">暂无相关新闻</div>';
        return;
    }

    container.innerHTML = items.slice(0, 12).map(item => `
        <div class="border-bottom pb-3">
            <a class="fw-semibold text-decoration-none d-block mb-1" href="${item.link || '#'}" target="_blank" rel="noreferrer">
                ${item.title || '未命名新闻'}
            </a>
            <div class="small text-muted">${item.publisher || '未知来源'} ${item.time || ''}</div>
        </div>
    `).join('');
}

function renderChart(history) {
    if (!history.length) {
        chart.setOption({
            title: {
                text: '暂无可展示的历史数据',
                left: 'center',
                top: 'middle',
                textStyle: { color: '#6c757d', fontSize: 16 }
            }
        });
        return;
    }

    const rows = [...history].sort((a, b) => new Date(a.date) - new Date(b.date));
    const dates = rows.map(item => item.date);
    const kline = rows.map(item => [item.open, item.close, item.low, item.high]);
    const ma20 = calculateMA(20, rows);
    const ma60 = calculateMA(60, rows);

    chart.setOption({
        animation: false,
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross' }
        },
        legend: {
            data: ['K线', 'MA20', 'MA60'],
            top: 10
        },
        grid: {
            left: '8%',
            right: '6%',
            top: 50,
            bottom: 40
        },
        xAxis: {
            type: 'category',
            data: dates,
            scale: true,
            boundaryGap: false
        },
        yAxis: {
            scale: true
        },
        dataZoom: [
            { type: 'inside', start: 60, end: 100 },
            { type: 'slider', start: 60, end: 100, bottom: 10 }
        ],
        series: [
            {
                name: 'K线',
                type: 'candlestick',
                data: kline,
                itemStyle: {
                    color: '#d84a3a',
                    color0: '#3a8c54',
                    borderColor: '#d84a3a',
                    borderColor0: '#3a8c54'
                }
            },
            {
                name: 'MA20',
                type: 'line',
                data: ma20,
                smooth: true,
                showSymbol: false,
                lineStyle: { width: 1.5 }
            },
            {
                name: 'MA60',
                type: 'line',
                data: ma60,
                smooth: true,
                showSymbol: false,
                lineStyle: { width: 1.5 }
            }
        ]
    });
}

async function loadPage() {
    const detailRes = await fetch(`/api/v1/stocks/CN/${symbol}`);
    const detailJson = await detailRes.json();
    const detail = normalizeDetail(detailJson);

    document.getElementById('stock-title').textContent = `${detail.name} (${symbol})`;
    document.getElementById('stock-summary').innerHTML =
        `最新价 <strong>${detail.price.toFixed(2)}</strong>，涨跌幅 ` +
        `<span class="${detail.changePct >= 0 ? 'text-danger' : 'text-success'}">${detail.changePct.toFixed(2)}%</span>`;
    renderNews(detail.news);

    const endDate = new Date();
    const startDate = new Date();
    startDate.setFullYear(endDate.getFullYear() - 1);
    const start = startDate.toISOString().split('T')[0];
    const end = endDate.toISOString().split('T')[0];

    const historyRes = await fetch(`/api/v1/stocks/CN/${symbol}/history?start=${start}&end=${end}`);
    const historyJson = await historyRes.json();
    renderChart(normalizeHistory(historyJson));
}

loadPage().catch(() => {
    document.getElementById('stock-summary').textContent = '数据加载失败，请稍后重试。';
    document.getElementById('news-list').innerHTML = '<div class="text-danger">新闻加载失败</div>';
    chart.setOption({
        title: {
            text: '图表加载失败',
            left: 'center',
            top: 'middle',
            textStyle: { color: '#dc3545', fontSize: 16 }
        }
    });
});

window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
