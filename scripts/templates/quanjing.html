<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>量化行情全景图</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .text-up { color: #dc3545; font-weight: bold; } /* 红色涨 */
        .text-down { color: #198754; font-weight: bold; } /* 绿色跌 */
        .card:hover { transform: translateY(-5px); transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">🌐 市场全景图 (Market Overview)</h2>
    <div class="row">
        {% for stock in stocks %}
        <div class="col-md-3 mb-4">
            <a href="/stock/{{ stock.ticker }}" class="text-decoration-none">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title text-dark">{{ stock.ticker }}</h5>
                        <h3 class="{% if stock.pct_chg >= 0 %}text-up{% else %}text-down{% endif %}">
                            ${{ stock.price }}
                        </h3>
                        <p class="mb-0 {% if stock.pct_chg >= 0 %}text-up{% else %}text-down{% endif %}">
                            {% if stock.pct_chg >= 0 %}▲ +{% else %}▼ {% endif %}{{ stock.pct_chg }}%
                        </p>
                        <small class="text-muted">成交量: {{ stock.volume }}</small>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
