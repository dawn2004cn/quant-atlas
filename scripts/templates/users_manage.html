{% extends "base.html" %}

{% block title %}用户管理{% endblock %}

{% block content %}
<div class="container py-4">
    <h1>用户管理</h1>

    <div class="card mb-4">
        <div class="card-header">
            创建新用户
        </div>
        <div class="card-body">
            <form id="createUserForm">
                <div class="form-group">
                    <label for="newUsername">用户名</label>
                    <input type="text" class="form-control" id="newUsername" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">密码</label>
                    <input type="password" class="form-control" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label for="newRole">角色</label>
                    <select id="newRole" class="form-control">
                        <option value="viewer">访客</option>
                        <option value="developer">开发者</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">创建用户</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            现有用户
        </div>
        <ul class="list-group list-group-flush" id="userList">
            <!-- User items will be loaded here by JavaScript -->
            <li class="list-group-item text-center text-muted">加载中...</li>
        </ul>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    $(document).ready(function() {
        

        function loadUsers() {
            $.get('/api/v1/users', function(res) {
                if (!res.status || res.status === 'success') {
                    $('#userList').empty();
                    if ((res.users || []).length === 0) {
                        $('#userList').append('<li class="list-group-item text-center text-muted">暂无用户</li>');
                    } else {
                        (res.users || []).forEach(function(user) {
                            $('#userList').append(`
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    ${user.username} (${user.role_name})
                                    <div>
                                        <button type="button" class="btn btn-info btn-sm change-password" data-username="${user.username}">修改密码</button>
                                        <button type="button" class="btn btn-danger btn-sm delete-user" data-username="${user.username}">删除</button>
                                    </div>
                                </li>
                            `);
                        });
                    }
                } else {
                    alert('加载用户失败: ' + res.message);
                }
            });
        }

        $('#createUserForm').submit(function(e) {
            e.preventDefault();
            const newUsername = $('#newUsername').val();
            const newPassword = $('#newPassword').val();
            const newRole = $('#newRole').val();

            $.ajax({
                url: '/api/v1/users',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username: newUsername, password: newPassword, role: newRole }),
                success: function(res) {
                    if (!res.status || res.status === 'success') {
                        alert(res.message);
                        $('#createUserForm')[0].reset();
                        loadUsers();
                    } else {
                        alert('创建用户失败: ' + res.message);
                    }
                }
            });
        });

        $('#userList').on('click', '.delete-user', function() {
            const username = $(this).data('username');
            if (confirm(`确定要删除用户 ${username} 吗？`)) {
                $.ajax({
                    url: `/api/v1/users/${username}`,
                    method: 'DELETE',
                    success: function(res) {
                        if (!res.status || res.status === 'success') {
                            alert(res.message);
                            loadUsers();
                        } else {
                            alert('删除失败: ' + res.message);
                        }
                    }
                });
            }
        });

        $('#userList').on('click', '.change-password', function() {
            const username = $(this).data('username');
            const newPassword = prompt(`请输入 ${username} 的新密码:`);
            if (newPassword) {
                const confirmPassword = prompt('请再次输入新密码进行确认:');
                if (newPassword === confirmPassword) {
                    $.ajax({
                        url: '/api/v1/change-password',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify({ username: username, new_password: newPassword, confirm_password: confirmPassword }),
                        success: function(res) {
                            if (!res.status || res.status === 'success') {
                                alert(res.message);
                            } else {
                                alert('修改密码失败: ' + res.message);
                            }
                        }
                    });
                } else {
                    alert('两次输入的密码不一致！');
                }
            }
        });

        loadUsers();
    });
</script>
{% endblock %}
